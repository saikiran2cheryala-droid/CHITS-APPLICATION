services:
  - type: web
    name: chit-manager
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: chit-manager-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: chit-manager-db
    databaseName: chit_manager
    user: chit_admin
    plan: starter
